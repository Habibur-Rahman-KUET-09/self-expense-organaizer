name: Build APK

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Version from pubspec (1.0.0+N -> 1.0.0.N)
        id: version
        run: |
          v=$(grep -E '^version: ' pubspec.yaml | sed -E 's/^version: ([0-9.]+)\+([0-9]+)$/\1.\2/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Personal Organiser $v"

      # One APK per processor type instead of one carrying all of them
      # (the bundled SQLite library is per processor too): arm64 fits
      # almost every phone from the last ten years, armv7 older ones. Dart
      # code is obfuscated and its debug symbols kept out of the app.
      - name: Build release APKs
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --obfuscate --split-debug-info=build/symbols

      - name: Name the APKs after the app and version
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "PersonalOrganiser-${{ steps.version.outputs.version }}.apk"
          mv app-armeabi-v7a-release.apk "PersonalOrganiser-${{ steps.version.outputs.version }}-purono-phone.apk"
          ls -lh PersonalOrganiser-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalOrganiser-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/PersonalOrganiser-*.apk
          retention-days: 30
